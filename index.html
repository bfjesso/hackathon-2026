<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Defense</title>
    <style>
      /* Prevent flash of unstyled content */
      html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
      body { opacity: 0; transition: opacity 0.15s ease; }
      body.ready { opacity: 1; }
    </style>
  </head>
  <body>
    <!-- Main Menu -->
    <div id="main-menu">
      <div class="menu-title">Power Defense</div>
      <div class="menu-subtitle">Survive with clean energy</div>
      <button class="menu-btn" id="new-game-btn">New Game</button>
      <button class="menu-btn" id="level-creator-btn" style="margin-top: 16px;">Level Creator</button>
    </div>

    <!-- Cutscene Overlay -->
    <div id="cutscene-overlay" style="display:none;">
      <div class="cutscene-text" id="cutscene-text"></div>
      <div class="skip-hint">Press Space to skip</div>
    </div>

    <!-- Level Editor UI (hidden by default) -->
    <div id="level-editor-ui" style="display:none;">
      <!-- Top toolbar -->
      <div id="editor-toolbar">
        <button class="editor-btn" id="editor-grass-btn" title="Add/Remove Ground (G)">🟩 Grass</button>
        <button class="editor-btn active" id="editor-draw-btn" title="Draw Path (Q)">🖌️ Path</button>
        <button class="editor-btn" id="editor-erase-btn" title="Erase (E)">🧹 Erase</button>
        <div class="editor-separator"></div>
        <label class="editor-label">Color:</label>
        <input type="color" id="editor-path-color" value="#cc8844" title="Path Color">
        <div class="editor-separator"></div>
        <button class="editor-btn editor-spawner-btn" id="editor-spawner-btn" title="Place Zombie Spawner (Z)">💀 Spawner</button>
        <button class="editor-btn editor-target-btn" id="editor-target-btn" title="Place Energy Target (T)">⚡ Target</button>
        <div class="editor-separator"></div>
        <button class="editor-btn editor-placeable-btn" id="editor-placeable-btn" title="Mark Buildable Tiles (R)">🔧 Placeable</button>
        <button class="editor-sm-btn" id="editor-all-placeable" title="Make all ground tiles placeable">All</button>
        <button class="editor-sm-btn" id="editor-none-placeable" title="Remove all placeable markings">None</button>
        <div class="editor-separator"></div>
        <button class="editor-btn" id="editor-clear-btn" title="Clear All Paths">🗑️ Clear</button>
        <div class="editor-separator"></div>
        <label class="editor-label">Theme:</label>
        <select id="editor-theme-select" class="editor-select">
          <option value="default">☀️ Default</option>
          <option value="winter">❄️ Winter</option>
          <option value="halloween">🎃 Halloween</option>
          <option value="christmas">🎄 Christmas</option>
          <option value="desert">🏜️ Desert</option>
          <option value="night">🌙 Night</option>
          <option value="ocean">🌊 Ocean</option>
        </select>
        <div class="editor-separator"></div>
        <label class="editor-label">Build View:</label>
        <select id="editor-buildview-select" class="editor-select">
          <option value="free">🎥 Free Camera</option>
          <option value="set">📌 Set View</option>
        </select>
        <button class="editor-sm-btn" id="editor-setview-btn" title="Capture current camera as build view" style="display:none;">📷 Capture</button>
        <div class="editor-separator"></div>
        <button class="editor-btn editor-play-btn" id="editor-play-btn" title="Save & Play this level">▶️ Play Level</button>
        <button class="editor-btn editor-back-btn" id="editor-back-btn">← Back to Menu</button>
      </div>
      <!-- Bottom hint bar -->
      <div id="editor-hint">
        Grass: expand ground · Path: draw routes · Spawner/Target: click to place · Placeable: mark buildable tiles · Build View: free or set camera for build mode · WASD + Arrows + Scroll
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
